    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', includedLanguages: 'en,zh-CN,ja,ko', autoDisplay: false }, 'google_translate_element');
        }
        function updateLanguageState(langCode) {
            document.documentElement.setAttribute('data-lang', langCode);
            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-lang') === langCode) {
                    btn.className = 'lang-btn bg-white text-slate-900 px-2.5 py-1 rounded shadow-sm transition font-bold';
                } else {
                    btn.className = 'lang-btn text-slate-500 hover:text-slate-900 px-2 py-1 transition font-medium';
                }
            });
        }
        function changeLanguage(langCode) {
            if (langCode === 'ko') { window.location.href = 'service3.html'; return; } 
            else if (langCode === 'en') { window.location.href = 'service3_en.html'; return; }
            const select = document.querySelector('.goog-te-combo');
            if (select) { select.value = langCode; select.dispatchEvent(new Event('change')); }
            updateLanguageState(langCode);
        }
        document.addEventListener("DOMContentLoaded", function() { updateLanguageState('en'); });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
